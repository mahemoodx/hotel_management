# =============================================================================
# Royal Pearl – Production profile
# All values must be supplied via environment variables; nothing is hardcoded.
# =============================================================================

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    out-of-order: false
    validate-on-migrate: true

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: WARN
    com.royalpearl.hotel: INFO
    org.flywaydb: WARN
  # Structured JSON logging for log aggregators (ELK / CloudWatch)
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%level",
       "thread":"%thread","logger":"%logger","message":"%msg"}%n

management:
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    # Disable try-it-out in production for security
    try-it-out-enabled: false
