# =============================================================================
# Royal Pearl Hyderabad – Base application configuration
# All secrets and environment-specific values come from environment variables.
# =============================================================================

spring:
  application:
    name: royal-pearl-hotel-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --------------------------------------------------------------------------
  # Data source
  # --------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/royalpearl}
    username: ${DB_USERNAME:royalpearl}
    password: ${DB_PASSWORD:royalpearl}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RoyalPearlPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # --------------------------------------------------------------------------
  # JPA / Hibernate
  # --------------------------------------------------------------------------
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC

  # --------------------------------------------------------------------------
  # Flyway
  # --------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # --------------------------------------------------------------------------
  # Jackson – ISO-8601 UTC timestamps, camelCase
  # --------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # --------------------------------------------------------------------------
  # OAuth2 (Google stub – enable by setting GOOGLE_CLIENT_ID/SECRET)
  # --------------------------------------------------------------------------
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# --------------------------------------------------------------------------
# Application JWT & feature configuration
# --------------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET}                                   # min 32 chars, required
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}         # 15 min default
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}    # 7 days default

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  admin:
    allowlist: ${ADMIN_ALLOWLIST:bashamahemood579@gmail.com}

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

# --------------------------------------------------------------------------
# Actuator
# --------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Royal Pearl Hotel Backend
    version: 1.0.0
    description: REST API for Royal Pearl Hyderabad Hotel Management

# --------------------------------------------------------------------------
# SpringDoc / Swagger
# --------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false

# --------------------------------------------------------------------------
# Logging defaults (overridden per profile below)
# --------------------------------------------------------------------------
logging:
  level:
    root: WARN
    com.royalpearl.hotel: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %-5level [%thread] %logger{36} - %msg%n"
