# =============================================================================
# Royal Pearl – Dev profile
# Runs locally with a local or docker-compose PostgreSQL instance.
# =============================================================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.royalpearl.hotel: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: DEBUG

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    try-it-out-enabled: true
