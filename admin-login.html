<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Royal Pearl Hyderabad</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--navy:#0b1737;--gold:#c89f4a;--gold-2:#a07a2c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 20%,#152a5c,#070b1d 70%);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#fff;padding:24px}
  .wrap{width:100%;max-width:420px;background:#fff;color:#222;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .top{background:linear-gradient(135deg,#0b1737,#1c2f63);color:#fff;text-align:center;padding:30px 24px}
  .top .badge{width:60px;height:60px;border-radius:50%;background:rgba(200,159,74,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--gold);font-size:26px;border:2px solid var(--gold)}
  .top h1{margin:0;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);letter-spacing:.5px}
  .top p{margin:6px 0 0;font-size:13px;color:#cfd6e8}
  form{padding:26px 28px 28px}
  .field{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:6px}
  input{width:100%;padding:11px 13px;border:1px solid #d6d8de;border-radius:9px;font-size:14px;outline:none}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,159,74,.18)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:6px 0 16px;color:#444}
  .row a{color:var(--navy);text-decoration:none;font-weight:600}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#fff;font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .foot{text-align:center;font-size:13px;color:#666;margin-top:14px}
  .foot a{color:var(--navy);text-decoration:none;font-weight:700}
  .note{background:#fff8e6;border:1px solid #f0d894;color:#7a5a10;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="badge"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>Admin Login</h1>
      <p>Royal Pearl Hyderabad — Restricted Access</p>
    </div>
    <form id="adminForm" novalidate>
      <div class="note"><i class="fa-solid fa-circle-info"></i> This area is for authorized hotel staff only.</div>
      <div class="field"><label>Admin Email</label><input type="email" name="email" required placeholder="admin@royalpearlhyderabad.com"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required minlength="6" placeholder="••••••••"></div>
      <div class="row">
        <label><input type="checkbox" name="remember"> Remember Me</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      <div class="foot"><a href="home">&larr; Back to Website</a></div>
    </form>
  </div>
<script>
  document.getElementById('adminForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(!this.checkValidity()){this.reportValidity();return;}
    alert('Admin login attempted (demo) — backend not connected.');
  });
</script>
</body>
</html>
